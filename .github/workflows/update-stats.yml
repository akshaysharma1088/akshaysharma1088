name: Update Ecosystem Download Stats

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and aggregate PyPI stats
        env:
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }} # Optional: free key from pepy.tech for lifetime totals
        run: python3 .github/scripts/update_ecosystem_stats.py

      - name: Commit updated stats JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/*.json
          git diff --staged --quiet || git commit -m "chore(stats): update combined dataranger + pipeverify downloads"
          git push
